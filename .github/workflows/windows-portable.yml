name: SKM candidate existing Windows EXE QA

on:
  workflow_dispatch:
  push:
    branches: [skm-workspace-candidate-20261030]
    paths: [.github/workflows/windows-portable.yml]

permissions:
  contents: read

concurrency:
  group: windows-portable-serial
  cancel-in-progress: false

jobs:
  portable:
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout private build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify private repository and runner storage
        run: |
          if ('${{ github.ref_type }}' -ne 'branch' -or '${{ github.ref }}' -eq 'refs/heads/main') { throw 'Candidate branch required; main is not authorized for this run' }
          if ('${{ github.repository }}' -ne 'MedinaParra/planificador-skm') { throw 'Unexpected repository' }
          if ('${{ github.event.repository.private }}' -ne 'true') { throw 'Private repository required' }
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($PWD.Path)).AvailableFreeSpace -lt 9GB) { throw 'Insufficient runner storage' }
          powershell.exe -NoProfile -File ci/test-script-syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell parser failed' }
          $tokens=$null; $parseErrors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/qa-existing-windows.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'QA-only script parser failed' }
          python --version
          python -c "import tarfile; assert hasattr(tarfile, 'data_filter'), 'Python tar data filter required'"
          if ($LASTEXITCODE -ne 0) { throw 'Python lacks safe tar filter' }
          python tools/test_prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation tests failed' }
      - name: Reconstruct and verify exact source bytes
        run: |
          python tools/prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source reconstruction failed' }
      - name: Prepare pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain setup failed' }
      - name: Verify run8 EXE and prior gates; compile and run remaining QA only
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/qa-existing-windows.ps1
      - name: Native Windows GUI and portability smoke without control credentials
        run: |
          powershell.exe -NoProfile -File ci/windows-portable-smoke.ps1 -Exe reused-production/solidcraft.exe -EvidenceDir build-evidence/gui
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI smoke failed' }
      - name: Package ZIP-only after verified gates
        run: |
          $receipt = Get-Content build-evidence/build-receipt.json -Raw | ConvertFrom-Json
          foreach ($gate in @('skm_shell_tests','skm_full_gpu_preview')) {
            if ($receipt.$gate -ne 'PASS') { throw "Required SKM gate $gate did not pass" }
          }
          if ($receipt.skm_shell_test_count -ne 5 -or $receipt.skm_preview_test_count -ne 1) { throw 'SKM test coverage mismatch' }
          powershell.exe -NoProfile -File ci/package-windows-portable.ps1 -Exe reused-production/solidcraft.exe -SourceRoot build-source -BuildReceipt build-evidence/build-receipt.json -SmokeResult build-evidence/gui/smoke-result.json -OutputDir dist
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
      - name: Preserve intermediate executable only when QA is incomplete
        if: failure() || cancelled()
        run: |
          $exe = 'reused-production/solidcraft.exe'
          if (Test-Path -LiteralPath $exe -PathType Leaf) {
            $stage = 'build-evidence/NO_QA-intermediate'
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'solidcraft.exe')
            foreach ($f in @('LICENSE-MIT','LICENSE-APACHE','NOTICE','THIRD-PARTY-LICENSES.txt','ATTRIBUTION.md')) {
              Copy-Item -LiteralPath (Join-Path 'build-source' $f) -Destination (Join-Path $stage $f)
            }
            'SIN PRUEBAS COMPLETAS / NO_QA. Intermedio para diagnostico, no entrega aprobada. RT750 NOT_VALIDATED.' | Set-Content (Join-Path $stage 'NO_QA.txt')
            Get-FileHash -LiteralPath $exe -Algorithm SHA256 | Format-List | Out-String | Set-Content (Join-Path $stage 'EXE-SHA256.txt')
            Compress-Archive -LiteralPath $stage -DestinationPath 'build-evidence/NO_QA-intermediate.zip'
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
      - name: Bound private artifacts within included storage
        id: artifact_bound
        if: always()
        run: |
          $files = @(Get-ChildItem dist -File -ErrorAction SilentlyContinue) + @(Get-ChildItem build-evidence -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.json','.log','.png','.txt','.zip' })
          $bytes = ($files | Measure-Object Length -Sum).Sum
          if ($bytes -gt 250MB) { throw "Artifact cap exceeded: $bytes bytes; nothing will be uploaded" }
      - name: Private artifact, one day retention, no release
        if: always() && steps.artifact_bound.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.json
            dist/*.txt
            build-evidence/**/*.json
            build-evidence/**/*.log
            build-evidence/**/*.png
            build-evidence/**/*.txt
            build-evidence/NO_QA-intermediate.zip

