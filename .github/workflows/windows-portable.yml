name: Windows portable private build and QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-serial
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout private QA recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify private repository and QA scripts
        run: |
          if ('${{ github.repository }}' -ne 'MedinaParra/planificador-skm') { throw 'Unexpected repository' }
          if ('${{ github.event.repository.private }}' -ne 'true') { throw 'Private repository required' }
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($PWD.Path)).AvailableFreeSpace -lt 9GB) { throw 'Insufficient runner storage' }
          powershell.exe -NoProfile -File ci/test-script-syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell parser failed' }
          python tools/test_prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation tests failed' }
      - name: Recover exact run 4 executable and receipts without compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/MedinaParra/planificador-skm/actions/artifacts/12890003273/zip > run4-evidence.zip
          if ($LASTEXITCODE -ne 0) { throw 'Run 4 artifact download failed' }
          if ((Get-FileHash run4-evidence.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5cf0b23eae9697550c9d6cc0abe6c68f9f2066b5f0507382ad046c2ef6573a10') { throw 'Original artifact hash mismatch' }
          Expand-Archive -LiteralPath run4-evidence.zip -DestinationPath recovered
          $prior = 'recovered/build-evidence'
          $receipt = Get-Content "$prior/build-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.source_commit -ne 'e1a2b55597e8ace5de4e25c7276d9f237b4deb73') { throw 'Unexpected build commit' }
          foreach ($gate in @('build_status','engine_lift_plan','ui_lift_plan','portable_tests')) {
            if ($receipt.$gate -ne 'PASS') { throw "Original gate not passed: $gate" }
          }
          if (($receipt.test_counts -join ',') -ne '40,65,4' -or $receipt.path_test_count -ne 8) { throw 'Original test coverage mismatch' }
          foreach ($property in $receipt.log_sha256.PSObject.Properties) {
            $p = Join-Path $prior $property.Name
            if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $property.Value) { throw 'Original test log hash mismatch' }
          }
          if ((Get-FileHash "$prior/NO_QA-intermediate.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7c2dea16ce9c06b96e317cb82a256d8a8d23f3d9d9db5032060075cc275ad004') { throw 'Intermediate ZIP hash mismatch' }
          Expand-Archive -LiteralPath "$prior/NO_QA-intermediate.zip" -DestinationPath recovered-exe
          $exe = 'recovered-exe/NO_QA-intermediate/solidcraft.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '59e1d0ff44cd8cc759ab68fd89b7c5fbdf048c79b79fab85e7f0597fadbadaf7' -or $hash -ne $receipt.exe_sha256) { throw 'Exact EXE hash mismatch' }
          New-Item -ItemType Directory build-evidence | Out-Null
          Copy-Item "$prior/build-receipt.json" build-evidence/build-receipt.json
          @{ schema=1; original_run=40844395738; original_artifact=12890003273; exe_sha256=$hash; recompiled=$false; qa_commit='${{ github.sha }}'; original_test_log_hashes='PASS' } | ConvertTo-Json | Set-Content build-evidence/reuse-receipt.json
      - name: Reconstruct exact source only for attribution and packaging checks
        run: |
          python tools/prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source reconstruction failed' }
      - name: Native Windows GUI and portability smoke without control credentials
        run: |
          powershell.exe -NoProfile -File ci/windows-portable-smoke.ps1 -Exe recovered-exe/NO_QA-intermediate/solidcraft.exe -EvidenceDir build-evidence/gui
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI smoke failed' }
      - name: Package same executable only after all verified gates
        run: |
          powershell.exe -NoProfile -File ci/package-windows-portable.ps1 -Exe recovered-exe/NO_QA-intermediate/solidcraft.exe -SourceRoot build-source -BuildReceipt build-evidence/build-receipt.json -SmokeResult build-evidence/gui/smoke-result.json -OutputDir dist
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
      - name: Bound private artifacts within included storage
        id: artifact_bound
        if: always()
        run: |
          $files = @(Get-ChildItem dist -File -ErrorAction SilentlyContinue) + @(Get-ChildItem build-evidence -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.json','.log','.png','.txt' })
          $bytes = ($files | Measure-Object Length -Sum).Sum
          if ($bytes -gt 250MB) { throw "Artifact cap exceeded: $bytes bytes; nothing will be uploaded" }
      - name: Private QA evidence and passing ZIP, one day retention
        if: always() && steps.artifact_bound.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-qa-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.json
            dist/*.txt
            build-evidence/**/*.json
            build-evidence/**/*.log
            build-evidence/**/*.png
            build-evidence/**/*.txt
